<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  document.querySelectorAll(".language-mermaid").forEach((element) => {
    element.classList.add("mermaid");
  });

  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    securityLevel: "loose"
  });
</script>
